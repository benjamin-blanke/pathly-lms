# Self-hosted backend for Pathly: Postgres + Auth (GoTrue) + a PostgREST
# API, fronted by a tiny internal Caddy gateway that path-routes
# /auth/v1/* and /rest/v1/* and adds CORS. This is the same underlying
# software Supabase Cloud runs — self-hosted instead of a hosted project,
# so the app code (Row Level Security policies, @supabase/supabase-js
# calls) works completely unchanged.
#
# Managed by install.sh — see that script for how the .env file here is
# generated. To operate manually:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f
#   docker compose -f docker/docker-compose.yml down          # stop
#   docker compose -f docker/docker-compose.yml down -v       # stop + wipe data

name: pathly-backend

services:
  db:
    container_name: pathly-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - db-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}

  auth:
    container_name: pathly-auth
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 5
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: ${API_EXTERNAL_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # No SMTP server is configured, so accounts are auto-confirmed instead
      # of requiring a confirmation email. Pathly has no "forgot password"
      # flow yet, so GoTrue's other mailer-dependent features go unused.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

  rest:
    container_name: pathly-rest
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # The auth.uid()/auth.role()/auth.email() helper functions baked into
      # the supabase/postgres image read the legacy per-claim GUCs
      # (request.jwt.claim.sub, etc.) rather than the modern JSON blob
      # (request.jwt.claims) — and our RLS policies depend on auth.uid()
      # throughout, so this must stay "true" for the same policies that
      # work against Supabase Cloud to work here.
      PGRST_DB_USE_LEGACY_GUCS: "true"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"

  gateway:
    container_name: pathly-gateway
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  db-data:
